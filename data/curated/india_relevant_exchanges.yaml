# Hand-curated, India-relevant attribution layer.
#
# Small and high-precision by design. The point of this file is not coverage —
# the TagPack layer does coverage. The point is that every row here has been
# checked by a human against a public source, so an attribution claim in a
# generated report can be defended line by line.
#
# CURATION STANDARD (do not relax this):
#   1. The label must be visible on a public page that anyone can open.
#   2. The `source` URL must be that page, not a search result or a forum post.
#   3. If you cannot open the URL and see the label, the entry does not go in.
#      Move it to `pending_verification` below instead of guessing.
#   4. An entry that is removed upstream is removed here too.
#
# This standard is why `pending_verification` exists and is not empty. Publishing
# an unverified deposit address as attribution would be exactly the fabrication
# this project refuses to make: it would put an exchange's name in a police case
# file on the strength of a guess.

title: India-relevant exchange addresses (hand-curated)
creator: SIH26183 team
source_name: manual_curated
source: https://github.com/graphsense/graphsense-tagpacks
currency: ETH
lastmod: 2026-09-07
confidence: 0.8

