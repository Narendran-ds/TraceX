    confidence: 0.8

# Entities that matter for Indian cases but for which this team has NOT verified
# a deposit address from a public source. They are named here so the gap is
# visible and can be closed by a curator with better sources — not silently
# omitted, and not filled in with a plausible-looking guess.
#
# The ingester reads `tags:` only, so nothing below is loaded into the database.
pending_verification:
