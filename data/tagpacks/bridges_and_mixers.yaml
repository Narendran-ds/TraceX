# GraphSense-style TagPack — cross-chain bridges and mixing services.
#
# These entries exist so the system can recognise a *confidence boundary*. When
# the trail reaches one of these contracts, deterministic on-chain tracing ends:
# the funds leave for another chain, or enter an anonymity set. The correct
# output at that point is "trail confidence degrades here", not a guess about
# what came out the other side.
#
# This is true of commercial tools too — they maintain confidence across swaps
# probabilistically, not deterministically. Reporting an honest dead end is more
# useful to an investigator than a confident wrong answer.

