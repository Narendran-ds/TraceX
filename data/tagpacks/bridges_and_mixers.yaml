  # Tornado Cash. These addresses carry TWO independent public facts, from two
  # different sources: OFAC designated them (data/ofac/), and they are a mixing
  # service (here). Both matter and neither implies the other — a sanctioned
  # personal wallet is still traceable onward, while a mixing service is a
  # confidence boundary regardless of whether anyone has sanctioned it. Without
  # the mixer tag the trail would be reported as if it could continue past an
  # anonymity set, which is exactly the false certainty this project refuses.
